publish_to: "none"
version: 1.1.3+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cookie_jar: ^4.0.8
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.1
  intl: ^0.20.2
  livekit_client: ^2.5.1
  permission_handler: ^12.0.1
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0
  signalr_netcore: ^1.4.4
  uuid: ^4.5.1
  path_provider: ^2.1.5
  camera: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
