# ASAMBLEAS — Nginx reverse proxy (pilot / nip.io)
# Dedicated site only — does not replace other VPS applications.

upstream asambleas_kestrel {
    server 127.0.0.1:5090;
    keepalive 32;
}

upstream asambleas_livekit {
    server 127.0.0.1:7880;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Never log query strings for ASAMBLEAS (defense if a client mis-sends secrets).
log_format asambleas_safe '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

# HTTP pilot by IP:port (compat with other preview ports on this VPS)
server {
    listen 8092;
    listen [::]:8092;
    server_name 164.68.99.83;
    access_log /var/log/nginx/asambleas.access.log asambleas_safe;

    client_max_body_size 20m;
    # Identity auth cookies + permission claims exceed nginx defaults.
    large_client_header_buffers 4 32k;
    proxy_buffer_size 256k;
    proxy_buffers 16 256k;
    proxy_busy_buffers_size 512k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    location / {
        proxy_pass http://asambleas_kestrel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_buffer_size 256k;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /hubs/ {
        proxy_pass http://asambleas_kestrel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# App hostname — ACME + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name asambleas.164.68.99.83.nip.io;

    access_log /var/log/nginx/asambleas.access.log asambleas_safe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asambleas.164.68.99.83.nip.io;

    access_log /var/log/nginx/asambleas.access.log asambleas_safe;

    ssl_certificate     /etc/letsencrypt/live/asambleas.164.68.99.83.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asambleas.164.68.99.83.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    large_client_header_buffers 4 32k;
    proxy_buffer_size 256k;
    proxy_buffers 16 256k;
    proxy_busy_buffers_size 512k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    location / {
        proxy_pass http://asambleas_kestrel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_buffer_size 256k;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /hubs/ {
        proxy_pass http://asambleas_kestrel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# LiveKit signaling — ACME + redirect to HTTPS (RTC UDP still direct to host)
server {
    listen 80;
    listen [::]:80;
    server_name livekit-asambleas.164.68.99.83.nip.io;

    access_log /var/log/nginx/asambleas.access.log asambleas_safe;

