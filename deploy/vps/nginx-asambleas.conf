    server_name livekit-asambleas.164.68.99.83.nip.io;

    access_log /var/log/nginx/asambleas.access.log asambleas_safe;

    ssl_certificate     /etc/letsencrypt/live/asambleas.164.68.99.83.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asambleas.164.68.99.83.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://asambleas_livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
