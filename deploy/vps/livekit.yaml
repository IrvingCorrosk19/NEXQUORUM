# LiveKit self-hosted config for ASAMBLEAS.
# API keys are injected at deploy time via server-side rewrite; do not commit real secrets.
# LiveKit runs with network_mode: host alongside egress for reliable RoomComposite WebRTC.
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 7882
  port_range_end: 7892
  use_external_ip: true
redis:
  address: 127.0.0.1:6379
keys:
  ASAMBLEAS_DEVKEY: "REPLACE_ME_LIVEKIT_SECRET"
logging:
  level: info
