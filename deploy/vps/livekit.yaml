# LiveKit self-hosted config for ASAMBLEAS.
# API keys are injected at deploy time via server-side rewrite; do not commit real secrets.
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 7882
  port_range_end: 7892
  use_external_ip: true
  # node_ip can be set by deploy script if auto-detect fails
redis:
  address: asambleas_redis:6379
keys:
  ASAMBLEAS_DEVKEY: "REPLACE_ME_LIVEKIT_SECRET"
logging:
  level: info
