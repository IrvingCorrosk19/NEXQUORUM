services:
  asambleas_postgres:
    image: postgres:16-alpine
    container_name: asambleas_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asambleas}
      POSTGRES_USER: ${POSTGRES_USER:-asambleas_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - asambleas_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - asambleas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8

  asambleas_redis:
    image: redis:7-alpine
    container_name: asambleas_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - asambleas_redis_data:/data
    ports:
      # Loopback only — required when egress uses host networking.
      - "127.0.0.1:6379:6379"
    networks:
      - asambleas_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8

  asambleas_web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    container_name: asambleas_web
    restart: unless-stopped
    depends_on:
      asambleas_postgres:
        condition: service_healthy
      asambleas_redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=asambleas_postgres;Port=5432;Database=${POSTGRES_DB:-asambleas};Username=${POSTGRES_USER:-asambleas_app};Password=${POSTGRES_PASSWORD}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_PUBLIC_USER_LIST: ${DEMO_PUBLIC_USER_LIST:-true}
      Demo__Enabled: ${DEMO_ENABLED:-true}
      Demo__PublicUserList: ${DEMO_PUBLIC_USER_LIST:-true}
      Demo__SeedUsers: "true"
      Demo__RotatePasswords: "true"
      Demo__Password: ${DEMO_PASSWORD}
      ASAMBLEAS_APPLY_MIGRATIONS: "true"
      ASAMBLEAS_ALLOW_INSECURE_LOGIN: ${ASAMBLEAS_ALLOW_INSECURE_LOGIN:-true}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_DEFAULT_ROOM_PREFIX: ${LIVEKIT_DEFAULT_ROOM_PREFIX:-assembly-}
      # LiveKit server runs on host network; Twirp API reached via docker host gateway.
      LIVEKIT_EGRESS_URL: ${LIVEKIT_EGRESS_URL:-http://host.docker.internal:7880}
      LiveKit__EgressUrl: ${LIVEKIT_EGRESS_URL:-http://host.docker.internal:7880}
      ASAMBLEAS_DISABLE_HTTPS_REDIRECTION: "true"
      ASAMBLEAS_DISABLE_HTTPS_REDIRECT: "true"
      # Production: no silent SyntheticPilotMp4 fallback (dev/tests may still enable).
      ASAMBLEAS_RECORDING_SYNTHETIC: ${ASAMBLEAS_RECORDING_SYNTHETIC:-false}
      Recording__AllowSyntheticFallback: ${ASAMBLEAS_RECORDING_SYNTHETIC:-false}
      Recording__StorageRoot: /data/recordings
      Recording__EgressOutputRoot: ${ASAMBLEAS_EGRESS_OUTPUT:-/data/recordings}
      ASAMBLEAS_EGRESS_OUTPUT: ${ASAMBLEAS_EGRESS_OUTPUT:-/data/recordings}
      ASAMBLEAS_DP_KEYS_PATH: /root/.aspnet/DataProtection-Keys
      ASAMBLEAS_PUBLIC_BASE_URL: ${ASAMBLEAS_PUBLIC_BASE_URL:-https://asambleas.164.68.99.83.nip.io}
      App__PublicBaseUrl: ${ASAMBLEAS_PUBLIC_BASE_URL:-https://asambleas.164.68.99.83.nip.io}
    ports:
      - "127.0.0.1:${ASAMBLEAS_HOST_PORT:-5090}:8080"
    volumes:
      - asambleas_recordings:/data/recordings
      - asambleas_dp_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - asambleas_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  asambleas_livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: asambleas_livekit
    restart: unless-stopped
    depends_on:
      asambleas_redis:
        condition: service_healthy
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # Same host network as egress so RoomComposite Chrome WebRTC is local.
    network_mode: host

  asambleas_egress:
    # Pin to same minor line as livekit-server:v1.8.4 (official compatibility).
    image: livekit/egress:v1.8.4
    container_name: asambleas_egress
    restart: unless-stopped
    depends_on:
      asambleas_redis:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      # Shared with asambleas_web — RoomComposite filepath = /data/recordings/{storageKey}
      - asambleas_recordings:/data/recordings
    # Chrome (room composite) requires elevated caps + larger shm (LiveKit docs ≥ v1.7.6).
    cap_add:
      - SYS_ADMIN
    shm_size: "1gb"
    network_mode: host

volumes:
  asambleas_postgres_data:
    name: asambleas_postgres_data
  asambleas_recordings:
    name: asambleas_recordings
  asambleas_dp_keys:
    name: asambleas_dp_keys
  asambleas_redis_data:
    name: asambleas_redis_data

networks:
  asambleas_net:
    name: asambleas_net
    driver: bridge
