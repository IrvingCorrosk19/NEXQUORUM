# LiveKit Egress worker config for ASAMBLEAS.
# api_key / api_secret are injected at deploy time; do not commit real secrets.
# Egress uses network_mode: host with LiveKit on the same host network namespace.
api_key: ASAMBLEAS_DEVKEY
api_secret: REPLACE_ME_LIVEKIT_SECRET
ws_url: ws://127.0.0.1:7880
insecure: true
redis:
  address: 127.0.0.1:6379
health_port: 9092
log_level: info
