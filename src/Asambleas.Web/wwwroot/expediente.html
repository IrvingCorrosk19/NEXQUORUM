<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expediente digital — ASAMBLEAS</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/assembly-room.css" />
  <link rel="stylesheet" href="/css/loading.css?v=ia2" />
  <link rel="stylesheet" href="/css/ia.css?v=ia2" />
  <link rel="stylesheet" href="/css/ux-remediation.css?v=ux1" />
  <link rel="stylesheet" href="/css/ux-ia-reeng.css?v=ia2" />
</head>
<body>
    <div class="app-shell">
    <aside class="app-nav" aria-label="Navegación">
      <div>
        <h1 class="brand">ASAMBLEAS</h1>
        <p class="nav-tenant" id="nav-tenant">Gobernanza</p>
      </div>
      <nav id="ia-nav" aria-label="Navegación contextual"></nav>
    </aside>
    <header class="app-top" role="banner">
      <div class="ia-top-context">
        <span class="ia-top-context__brand">ASAMBLEAS</span>
        <span class="ia-top-context__path" id="ia-context-label">Expediente</span>
      </div>
      <div class="cluster">
        <span id="ia-role-chip" class="badge badge-live"></span>
        <span id="user-chip" class="badge badge-live"></span>
        <button type="button" id="btn-logout" class="btn btn-secondary">Salir</button>
      </div>
    </header>
    <main id="main" class="app-workspace page-main">
      <div id="ia-breadcrumbs"></div>
      <div id="page-alert" class="inline-alert inline-alert-error" hidden></div>
      <section class="page-hero">
        <h1 id="page-title">Expediente digital</h1>
        <p class="muted" id="page-sub"></p>
      </section>

    <section class="panel" id="policy-panel" hidden>
      <h2>Aviso de grabación</h2>
      <p id="notice-text"></p>
      <button type="button" id="btn-ack-notice" class="btn btn-primary">Entendido</button>
    </section>

    <section class="panel">
      <h2>Grabaciones</h2>
      <div id="recordings-list" class="stack"></div>
    </section>

    <section class="panel" id="player-panel" hidden>
      <h2>Reproductor</h2>
      <p id="player-meta" class="muted"></p>
      <video id="player" controls playsinline style="width:100%;max-height:70vh;background:#000;border-radius:8px"></video>
    </section>

    <section class="panel">
      <h2>Descargas del expediente</h2>
      <p class="muted">La grabación de video se descarga por separado (no se incluye en el ZIP).</p>
      <div class="stack" style="gap:0.75rem">
        <button type="button" class="btn btn-secondary" data-dl="package">↓ Descargar expediente completo (ZIP)</button>
      </div>
      <ul id="timeline" class="stack" style="margin-top:1.25rem"></ul>
    </section>
  </main>
  </div>
  <script type="module" src="/js/modules/expediente-app.js?v=ia3"></script>
</body>
</html>
