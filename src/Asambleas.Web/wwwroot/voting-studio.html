<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Votaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css?v=ia3" />
  <link rel="stylesheet" href="/css/base.css?v=ia3" />
  <link rel="stylesheet" href="/css/components.css?v=ia3" />
  <link rel="stylesheet" href="/css/feedback.css?v=fb1" />
  <link rel="stylesheet" href="/css/loading.css?v=ia3" />
  <link rel="stylesheet" href="/css/voting-studio.css?v=vs6" />
  <link rel="stylesheet" href="/css/ia.css?v=ia4" />
  <link rel="stylesheet" href="/css/ux-remediation.css?v=ux1" />
  <link rel="stylesheet" href="/css/ux-ia-reeng.css?v=ia2" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="app-shell studio-shell">
    <aside class="app-nav" aria-label="Navegación">
      <div>
        <h1 class="brand">ASAMBLEAS</h1>
        <p class="nav-tenant" id="nav-tenant">Gobernanza</p>
      </div>
      <nav id="ia-nav" aria-label="Navegación contextual"></nav>
    </aside>

    <header class="app-top" role="banner">
      <div class="ia-top-context"><span class="ia-top-context__brand">ASAMBLEAS</span><span class="ia-top-context__path" id="ia-context-label">Votaciones</span></div>
      <div class="cluster">
        <span id="ia-role-chip" class="badge badge-live"></span>
        <span id="user-chip" class="badge badge-live"></span>
        <button type="button" id="btn-logout" class="btn btn-secondary">Salir</button>
      </div>
    </header>

    <main id="main" class="app-workspace page-main page-main--wide studio-main">
      <div id="page-alert" class="alert" hidden role="alert"></div>
      <div id="ia-breadcrumbs"></div>

      <section class="page-hero page-hero--compact">
        <div class="ia-toolbar">
          <div>
            <h1 style="margin:0">Votaciones</h1>
            <p class="lede" id="assembly-label"><span class="skeleton" style="display:inline-block;width:14rem;height:1rem"></span></p>
          </div>
          <div class="cluster">
            <button type="button" class="btn btn-primary" id="btn-create">+ Crear</button>
            <details class="ia-asm-tabs__more">
              <summary class="btn btn-secondary" style="list-style:none;cursor:pointer">Más ▾</summary>
              <div class="ia-asm-tabs__menu">
                <button type="button" class="ia-asm-tab" id="btn-open-templates" style="width:100%;border:0;background:transparent;text-align:left">Plantillas</button>
              </div>
            </details>
          </div>
        </div>
      </section>

      <div class="ia-voting-layout" id="voting-layout">
        <section class="panel ia-panel--flat" aria-label="Listado de votaciones">
          <div class="studio-tabs" role="tablist">
            <button type="button" class="studio-tab is-active" data-tab="votes" role="tab" aria-selected="true">Votaciones</button>
            <button type="button" class="studio-tab" data-tab="surveys" role="tab" aria-selected="false">Encuestas</button>
          </div>

          <div id="votes-panel">
            <div class="ia-toolbar" style="margin-top:0.75rem">
              <div class="ia-toolbar__filters" id="vote-filters" role="toolbar" aria-label="Filtrar votaciones">
                <button type="button" data-filter="all" aria-pressed="true">Todas</button>
                <button type="button" data-filter="draft" aria-pressed="false">Borradores</button>
                <button type="button" data-filter="ready" aria-pressed="false">Preparadas</button>
                <button type="button" data-filter="live" aria-pressed="false">En vivo</button>
                <button type="button" data-filter="closed" aria-pressed="false">Cerradas</button>
              </div>
              <label class="cluster" style="gap:0.35rem;font-size:0.875rem">
                <span class="muted">Buscar</span>
                <input type="search" id="vote-search" placeholder="Título…" style="min-width:10rem" />
              </label>
            </div>
            <div id="list-votes" class="studio-list-body"></div>
          </div>

          <div id="surveys-panel" hidden>
            <div id="list-surveys" class="studio-list-body"></div>
          </div>

          <div id="list-templates" class="studio-list-body" hidden></div>
        </section>

        <section class="panel studio-editor" id="editor-panel" hidden aria-label="Editor">
          <div class="studio-editor-head">
            <h2 id="editor-title">Crear votación</h2>
            <span id="editor-status" class="badge">Borrador</span>
          </div>
          <div class="studio-editor-grid">
            <div class="studio-canvas" id="editor-canvas"></div>
            <aside class="studio-config" id="editor-config" aria-label="Configuración"></aside>
          </div>
          <div class="studio-actions">
            <button type="button" class="btn btn-ghost" id="btn-preview">Vista previa</button>
            <button type="button" class="btn btn-secondary" id="btn-save-draft">Guardar borrador</button>
            <button type="button" class="btn btn-primary" id="btn-publish">Publicar</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <dialog id="create-dialog">
    <form method="dialog" class="ux-form-sections" style="min-width:min(24rem,90vw)">
      <h2 style="margin-top:0">¿Qué deseas crear?</h2>
      <label style="display:grid;gap:0.35rem;margin:0.75rem 0">
        <span><input type="radio" name="create-kind" value="vote" checked /> <strong>Votación</strong></span>
        <span class="muted" style="margin-left:1.35rem">Para tomar una decisión formal de la Asamblea.</span>
      </label>
      <label style="display:grid;gap:0.35rem;margin:0.75rem 0">
        <span><input type="radio" name="create-kind" value="survey" /> <strong>Encuesta</strong></span>
        <span class="muted" style="margin-left:1.35rem">Para recopilar opiniones o información.</span>
      </label>
      <div class="cta-row" style="justify-content:flex-end;margin-top:1rem">
        <button type="submit" class="btn btn-secondary" value="cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" value="ok">Continuar</button>
      </div>
    </form>
  </dialog>

  <dialog id="preview-dialog" class="studio-preview-dialog" aria-labelledby="preview-title" aria-describedby="preview-subtitle">
    <div class="studio-preview">
      <header class="studio-preview__header">
        <div class="studio-preview__heading">
          <h2 id="preview-title">Vista previa</h2>
          <p id="preview-subtitle" class="studio-preview__subtitle">Así verá esta votación el participante</p>
        </div>
        <button type="button" class="studio-preview__close" id="btn-preview-close" aria-label="Cerrar vista previa">
          <span aria-hidden="true">×</span>
        </button>
        <div class="preview-devices" role="group" aria-label="Dispositivo de vista previa">
          <button type="button" data-device="desktop" class="is-active" aria-pressed="true">Desktop</button>
          <button type="button" data-device="tablet" aria-pressed="false">Tablet</button>
          <button type="button" data-device="mobile" aria-pressed="false">Móvil</button>
        </div>
      </header>
      <div class="studio-preview__stage" id="preview-stage">
        <div id="preview-frame" class="preview-frame is-desktop" role="region" aria-label="Marco de dispositivo"></div>
      </div>
      <footer class="studio-preview__footer">
        <button type="button" class="btn btn-ghost" id="btn-preview-dismiss">Cerrar</button>
      </footer>
    </div>
  </dialog>

  <script type="module" src="/js/modules/voting-studio-app.js?v=vs6"></script>
</body>
</html>
