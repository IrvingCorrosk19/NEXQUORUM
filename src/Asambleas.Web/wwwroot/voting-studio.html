<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Votaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css?v=px1" />
  <link rel="stylesheet" href="/css/base.css?v=px1" />
  <link rel="stylesheet" href="/css/components.css?v=px1" />
  <link rel="stylesheet" href="/css/loading.css?v=px1" />
  <link rel="stylesheet" href="/css/voting-studio.css?v=vs1" />
  <link rel="stylesheet" href="/css/ia.css?v=ia2" />
  <link rel="stylesheet" href="/css/ux-remediation.css?v=ux1" />
  <link rel="stylesheet" href="/css/ux-ia-reeng.css?v=ia2" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="app-shell studio-shell">
    <aside class="app-nav" aria-label="Navegación">
      <div>
        <h1 class="brand">ASAMBLEAS</h1>
        <p class="nav-tenant" id="nav-tenant">Gobernanza</p>
      </div>
      <nav id="ia-nav" aria-label="Navegación contextual"></nav>
    </aside>

    <header class="app-top" role="banner">
      <div class="ia-top-context"><span class="ia-top-context__brand">ASAMBLEAS</span><span class="ia-top-context__path" id="ia-context-label">Votaciones</span></div>
      <div class="cluster">
        <span id="ia-role-chip" class="badge badge-live"></span>
        <span id="user-chip" class="badge badge-live"></span>
        <button type="button" id="btn-logout" class="btn btn-secondary">Salir</button>
      </div>
    </header>

    <main id="main" class="app-workspace page-main studio-main">
      <div id="page-alert" class="alert" hidden role="alert"></div>
      <div id="ia-breadcrumbs"></div>

      <section class="page-hero studio-hero">
        <p class="command-eyebrow">Asamblea</p>
        <h1>Votaciones</h1>
        <p class="lede" id="assembly-label">Cargando asamblea…</p>
        <div class="cta-row">
          <button type="button" class="btn btn-primary" id="btn-new-vote">+ Nueva votación</button>
          <button type="button" class="btn btn-secondary" id="btn-new-survey">+ Nuevo formulario / encuesta</button>
        </div>
      </section>

      <div class="studio-layout">
        <section class="panel studio-list" aria-label="Instrumentos">
          <div class="studio-tabs" role="tablist">
            <button type="button" class="studio-tab is-active" data-tab="votes" role="tab" aria-selected="true">Votaciones</button>
            <button type="button" class="studio-tab" data-tab="surveys" role="tab" aria-selected="false">Formularios</button>
            <button type="button" class="studio-tab" data-tab="templates" role="tab" aria-selected="false">Plantillas</button>
          </div>
          <div id="list-votes" class="studio-list-body"></div>
          <div id="list-surveys" class="studio-list-body" hidden></div>
          <div id="list-templates" class="studio-list-body" hidden></div>
        </section>

        <section class="panel studio-editor" id="editor-panel" hidden aria-label="Editor">
          <div class="studio-editor-head">
            <h2 id="editor-title">Crear votación</h2>
            <span id="editor-status" class="badge">Borrador</span>
          </div>
          <div class="studio-editor-grid">
            <div class="studio-canvas" id="editor-canvas"></div>
            <aside class="studio-config" id="editor-config" aria-label="Configuración"></aside>
          </div>
          <div class="studio-actions">
            <button type="button" class="btn btn-ghost" id="btn-preview">Vista previa</button>
            <button type="button" class="btn btn-secondary" id="btn-save-draft">Guardar borrador</button>
            <button type="button" class="btn btn-primary" id="btn-publish">Publicar</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <dialog id="preview-dialog" class="studio-preview-dialog">
    <form method="dialog" class="studio-preview">
      <header>
        <h2>Vista previa</h2>
        <div class="preview-devices" role="group" aria-label="Dispositivo">
          <button type="button" data-device="desktop" class="is-active">Desktop</button>
          <button type="button" data-device="tablet">Tablet</button>
          <button type="button" data-device="mobile">Móvil</button>
        </div>
      </header>
      <div id="preview-frame" class="preview-frame is-desktop"></div>
      <footer>
        <button type="submit" class="btn btn-secondary" value="close">Cerrar</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="/js/modules/voting-studio-app.js?v=vs1"></script>
</body>
</html>
