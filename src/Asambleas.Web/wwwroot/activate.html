<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Activar acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css?v=ph1" />
  <link rel="stylesheet" href="/css/base.css?v=ph1" />
  <link rel="stylesheet" href="/css/components.css?v=ph1" />
  <link rel="stylesheet" href="/css/feedback.css?v=fb1" />
  <link rel="stylesheet" href="/css/ph.css?v=ph2" />
</head>
<body>
  <main class="app-workspace page-main" style="max-width:28rem;margin:4rem auto">
    <h1 class="brand">ASAMBLEAS</h1>
    <p class="lede">Activa tu acceso al portal. Define tu contraseña — nunca la enviamos por enlace.</p>
    <div id="page-alert" class="alert" hidden role="alert"></div>
    <div id="activate-meta" class="panel" hidden style="margin-bottom:1rem;padding:1rem"></div>
    <form id="form-activate" class="form-grid panel">
      <label>Nombre para mostrar <input name="displayName" autocomplete="name" /></label>
      <label>Nueva contraseña
        <span class="password-field">
          <input name="password" type="password" required minlength="12" autocomplete="new-password" />
          <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
            <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.8 21.8 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </span>
      </label>
      <p class="muted" style="margin:-.25rem 0 .5rem;font-size:.875rem">
        Mínimo 12 caracteres, con mayúscula, minúscula, número y símbolo (ej. ! @ # $).
      </p>
      <label>Confirmar contraseña
        <span class="password-field">
          <input name="confirmPassword" type="password" required minlength="12" autocomplete="new-password" />
          <button type="button" class="password-toggle" data-toggle-password="confirmPassword" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
            <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.8 21.8 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </span>
      </label>
      <button type="submit" class="btn btn-primary">Activar cuenta</button>
    </form>
  </main>
  <script type="module" src="/js/modules/activate-app.js?v=ph5"></script>
</body>
</html>
