<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Agenda</title>
  <link rel="stylesheet" href="/css/tokens.css?v=flow1" />
  <link rel="stylesheet" href="/lib/tabler/1.7.5/css/tabler.min.css" />
  <link rel="stylesheet" href="/css/feedback.css?v=fb2" />
  <link rel="stylesheet" href="/css/ph-tabler.css?v=final1" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body class="layout-tabler">
  <a class="skip-link visually-hidden-focusable" href="#main">Saltar al contenido</a>
  <div class="page app-shell">
    <aside class="navbar navbar-vertical navbar-expand-lg app-nav" data-bs-theme="dark" aria-label="Navegación">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" id="btn-nav-toggle" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-controls="sidebar-menu" aria-expanded="false" aria-label="Abrir menú de navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <h1 class="navbar-brand navbar-brand-autodark"><a href="/ph.html">Asambleas</a></h1>
        <p class="nav-tenant visually-hidden" id="nav-tenant">Gobernanza</p>
        <div class="collapse navbar-collapse" id="sidebar-menu">
          <nav id="ia-nav" aria-label="Navegación contextual"></nav>
          <script src="/js/shell-paint.js?v=polish7"></script>
        </div>
      </div>
    </aside>
    <div class="page-wrapper">
      <header class="navbar navbar-expand-md d-print-none app-top" role="banner">
        <div class="container-xl">
          <span id="ia-context-label" class="visually-hidden">Agenda</span>
          <div class="d-flex align-items-center gap-2 cluster" id="header-cluster"></div>
          <div class="navbar-nav flex-row order-md-last ms-auto">
            <div class="nav-item dropdown">
              <a href="#" class="nav-link d-flex lh-1 p-0 px-2" data-bs-toggle="dropdown" aria-label="Menú de cuenta" aria-expanded="false">
                <span class="avatar avatar-sm" id="user-avatar">AS</span>
                <div class="d-none d-md-block ps-2">
                  <div id="user-chip">Cuenta</div>
                  <div class="mt-1 small text-secondary" id="ia-role-chip"></div>
                </div>
              </a>
              <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                <span class="dropdown-header" id="account-role-label">Cuenta</span>
                <a class="dropdown-item" href="#" id="btn-logout">Salir</a>
              </div>
            </div>
          </div>
        </div>
      </header>
      <main id="main" class="page-main">
        <div class="container-xl">
          <div id="page-alert" class="alert alert-danger" hidden role="alert"></div>
          <div id="ia-breadcrumbs"></div>
          <section class="brand-hero">
            <div class="brand-hero__inner">
              <div>
                <p class="brand-hero__kicker">Agenda</p>
                <h1 class="brand-hero__title" id="page-title">Agenda de la asamblea</h1>
                <p class="conv-hero-meta" id="assembly-label"></p>
              </div>
              <button type="button" class="btn btn-primary" id="btn-open-agenda">Agregar punto</button>
            </div>
          </section>
          <section class="card">
            <div class="card-body">
              <h2 class="card-title">Puntos de agenda</h2>
              <div id="agenda-list"><div class="progress progress-sm"><div class="progress-bar progress-bar-indeterminate"></div></div></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <dialog id="dlg-agenda" class="app-sheet" aria-labelledby="agenda-dialog-title">
    <form id="agenda-form" class="app-sheet__form">
      <header class="app-sheet__head">
        <h2 id="agenda-dialog-title" tabindex="-1">Agregar punto</h2>
        <button type="button" class="btn app-sheet__close" id="agenda-dialog-close" aria-label="Cerrar">✕</button>
      </header>
      <div class="app-sheet__body">
        <label class="form-label">Código
          <input class="form-control" id="agenda-code" type="text" maxlength="32" placeholder="A01" autocomplete="off" />
        </label>
        <label class="form-label">Título
          <input class="form-control" id="agenda-title" type="text" required maxlength="200" placeholder="Ej. Aprobación de estados financieros" />
        </label>
      </div>
      <footer class="app-sheet__foot">
        <button type="button" class="btn btn-secondary" id="agenda-dialog-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar punto</button>
      </footer>
    </form>
  </dialog>
  <script src="/lib/tabler/1.7.5/js/tabler.min.js"></script>
  <script type="module" src="/js/modules/agenda-app.js?v=flow7"></script>
</body>
</html>
