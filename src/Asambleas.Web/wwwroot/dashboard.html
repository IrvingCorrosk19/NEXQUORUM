<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Asamblea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css?v=ia3" />
  <link rel="stylesheet" href="/css/base.css?v=ia3" />
  <link rel="stylesheet" href="/css/components.css?v=ia3" />
  <link rel="stylesheet" href="/css/feedback.css?v=fb1" />
  <link rel="stylesheet" href="/css/loading.css?v=ia3" />
  <link rel="stylesheet" href="/css/ia.css?v=ia3" />
  <link rel="stylesheet" href="/css/ux-remediation.css?v=ux1" />
  <link rel="stylesheet" href="/css/ux-ia-reeng.css?v=ia2" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="app-nav" aria-label="Navegación">
      <div>
        <h1 class="brand">ASAMBLEAS</h1>
        <p class="nav-tenant" id="nav-tenant">Gobernanza</p>
      </div>
      <nav id="ia-nav" aria-label="Navegación contextual"></nav>
    </aside>

    <header class="app-top" role="banner">
      <div class="ia-top-context">
        <span class="ia-top-context__brand">ASAMBLEAS</span>
        <span class="ia-top-context__path" id="ia-context-label">Asamblea</span>
      </div>
      <div class="cluster">
        <span id="ia-role-chip" class="badge badge-live"></span>
        <span id="user-chip" class="badge badge-live"></span>
        <button type="button" id="btn-logout" class="btn btn-secondary">Salir</button>
      </div>
    </header>

    <main id="main" class="app-workspace page-main page-main--wide">
      <div id="page-alert" class="alert" hidden role="alert"></div>
      <div id="historical-banner" class="ia-historical-banner" hidden role="status"></div>
      <div id="ia-breadcrumbs"></div>

      <section class="page-hero page-hero--compact">
        <div class="cluster" style="gap:0.75rem;align-items:center;flex-wrap:wrap;justify-content:space-between">
          <div>
            <div class="cluster" style="gap:0.75rem;align-items:center;flex-wrap:wrap">
              <h1 id="assembly-name" style="margin:0"><span class="skeleton" style="display:inline-block;width:16rem;height:1.6rem"></span></h1>
              <span id="assembly-status-badge" class="ia-badge-status" hidden></span>
            </div>
            <div class="meta-row" id="assembly-meta"></div>
          </div>
        </div>
      </section>

      <div class="ia-stat-strip" id="assembly-stat-strip" aria-label="Indicadores de la asamblea"></div>

      <div class="ia-overview-grid">
        <section class="panel" id="readiness" aria-labelledby="readiness-heading">
          <h2 id="readiness-heading" class="section-title">Preparación</h2>
          <div id="readiness-panel"><div class="skeleton" style="height:8rem"></div></div>
        </section>

        <section class="panel" aria-label="Siguiente paso">
          <h2 class="section-title">Siguiente paso</h2>
          <div id="primary-cta"></div>
        </section>

        <section class="panel ia-overview-grid__full" aria-label="Accesos rápidos">
          <h2 class="section-title">Accesos rápidos</h2>
          <div id="secondary-links"></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/js/modules/dashboard-app.js?v=ia3"></script>
</body>
</html>
