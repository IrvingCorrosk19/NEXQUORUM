<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Check-in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <style>
    .checkin-shell { display: grid; gap: 1.25rem; }
    @media (min-width: 768px) {
      .checkin-shell { grid-template-columns: minmax(0, 1fr) minmax(16rem, 20rem); align-items: start; }
    }
    .checkin-live {
      display: grid; gap: 0.75rem; padding: 1rem 1.1rem;
      background: color-mix(in srgb, var(--color-surface) 88%, var(--color-accent, #1a5f4a) 12%);
      border-radius: 0;
    }
    .checkin-live .metric { font-family: "Source Serif 4", Georgia, serif; font-size: 1.75rem; font-weight: 600; }
    .checkin-search input {
      min-height: 3rem; font-size: 1.05rem; width: 100%;
    }
    .accreditation-card {
      padding: 1.1rem 1.15rem; border-bottom: 1px solid color-mix(in srgb, var(--color-ink) 12%, transparent);
      display: grid; gap: 0.65rem;
    }
    .accreditation-card .owner-name { font-family: "Source Serif 4", Georgia, serif; font-size: 1.35rem; margin: 0; }
    .accreditation-card .btn { min-height: 3rem; font-size: 1rem; }
    .review-panel {
      position: fixed; inset: 0; background: color-mix(in srgb, #0a1210 55%, transparent);
      display: grid; place-items: end center; z-index: 40; padding: 0;
    }
    .review-panel[hidden] { display: none !important; }
    .review-sheet {
      width: min(100%, 32rem); max-height: 92vh; overflow: auto;
      background: var(--color-surface, #f7f4ef); color: var(--color-ink, #14201c);
      padding: 1.25rem 1.25rem 1.75rem; display: grid; gap: 0.85rem;
    }
    .review-sheet h2 { font-family: "Source Serif 4", Georgia, serif; margin: 0; font-size: 1.5rem; }
    .review-sheet dl { display: grid; gap: 0.35rem; margin: 0; }
    .review-sheet dt { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.7; }
    .review-sheet dd { margin: 0; font-size: 1.05rem; }
    .conflict-box {
      border-left: 3px solid var(--color-danger, #9b2c2c);
      padding: 0.75rem 0.85rem; background: color-mix(in srgb, #9b2c2c 8%, transparent);
    }
    .success-panel { text-align: center; display: grid; gap: 0.5rem; padding: 1.5rem 0.5rem; }
    .success-panel .check { font-size: 2rem; color: var(--color-accent, #1a5f4a); }
    .recent-list { display: grid; gap: 0.35rem; font-size: 0.95rem; }
    .sr-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (min-width: 768px) {
      .review-panel { place-items: center; }
      .review-sheet { border-radius: 0; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="page-shell">
    <header class="page-header">
      <h1 class="brand">ASAMBLEAS</h1>
      <a id="link-dashboard" class="btn btn-secondary" href="#">Volver</a>
    </header>
    <main id="main" class="page-main">
      <div id="page-alert" class="alert" hidden role="alert"></div>
      <p id="sr-announcer" class="sr-live" aria-live="polite"></p>
      <section class="page-hero">
        <h1 id="page-title">Check-in</h1>
        <p class="muted" id="assembly-label"></p>
      </section>
      <div class="checkin-shell">
        <div class="stack">
          <div class="field checkin-search">
            <label for="participant-filter">Buscar nombre, unidad…</label>
            <input id="participant-filter" type="search" autocomplete="off" enterkeyhint="search" />
          </div>
          <div id="cards-root" class="grid-cards"><div class="skeleton" style="height:10rem"></div></div>
          <div class="cta-row">
            <button type="button" id="btn-self-checkin" class="btn btn-primary">Registrar mi asistencia</button>
            <a id="link-lobby" class="btn btn-gold" href="#">Ir al lobby</a>
          </div>
        </div>
        <aside class="checkin-live" aria-label="Estado de asistencia">
          <div>
            <div class="muted">Quórum</div>
            <div id="live-quorum" class="metric">—</div>
            <div id="live-quorum-meta" class="muted"></div>
          </div>
          <div>
            <div class="muted">Presentes / Acreditados</div>
            <div id="live-counts" class="metric" style="font-size:1.25rem">—</div>
          </div>
          <div>
            <div class="muted">Recientes</div>
            <div id="recent-root" class="recent-list muted">Sin acreditaciones aún</div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <div id="review-panel" class="review-panel" hidden role="dialog" aria-modal="true" aria-labelledby="review-title">
    <div class="review-sheet">
      <h2 id="review-title">Revisar acreditación</h2>
      <div id="review-body"></div>
      <div class="cta-row">
        <button type="button" id="btn-review-cancel" class="btn btn-secondary">Cancelar</button>
        <button type="button" id="btn-review-confirm" class="btn btn-primary">Acreditar y check-in</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js" crossorigin="anonymous"></script>
  <script type="module" src="/js/modules/checkin-app.js"></script>
</body>
</html>
