<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <a class="skip-link" href="#login-form">Saltar al acceso</a>
  <main class="login-shell">
    <section class="login-composition panel" aria-labelledby="brand">
      <h1 id="brand" class="brand">ASAMBLEAS</h1>
      <p class="lede">Gobernanza y quorum en tiempo real para propiedades horizontales.</p>

      <div id="login-error" class="alert" hidden role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field" style="margin-top:1rem">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div style="margin-top:1.25rem; display:flex; gap:0.75rem; flex-wrap:wrap">
          <button type="submit" class="btn btn-primary">Entrar</button>
        </div>
      </form>

      <div class="demo-list" aria-label="Usuarios demo">
        <p style="margin:0; color:var(--color-slate-muted); font-size:0.9rem">
          Usuarios demo (Development). Contraseña solo en documentación.
        </p>
        <div id="demo-users"><div class="skeleton" style="height:3rem"></div></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { api } from "/js/modules/api.js";
    import { login, me } from "/js/modules/auth.js";

    const errorEl = document.querySelector("#login-error");
    const demoRoot = document.querySelector("#demo-users");
    const emailInput = document.querySelector("#email");
    const passwordInput = document.querySelector("#password");
    let defaultAssemblyId = null;

    function showError(message) {
      errorEl.hidden = !message;
      errorEl.textContent = message || "";
    }

    function goDashboard(assemblyId) {
      if (!assemblyId) {
        showError("No hay asamblea demo disponible.");
        return;
      }
      location.href = `/dashboard.html?assemblyId=${assemblyId}`;
    }

    try {
      await me();
      const users = await api("/api/demo/users");
      defaultAssemblyId = users?.[0]?.assemblyId;
      if (defaultAssemblyId) {
        goDashboard(defaultAssemblyId);
      }
    } catch {
      // not authenticated
    }

    try {
      const users = await api("/api/demo/users");
      defaultAssemblyId = users?.[0]?.assemblyId;
      demoRoot.innerHTML = users
        .map(
          (u) => `
          <button type="button" data-email="${u.email}">
            <strong>${u.displayName}</strong><br />
            <span>${u.email} · ${u.role} · Unidad ${u.unitCode}</span>
          </button>`
        )
        .join("");

      demoRoot.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          emailInput.value = btn.getAttribute("data-email");
          passwordInput.focus();
        });
      });
    } catch (error) {
      demoRoot.innerHTML = `<p>${error.message}</p>`;
    }

    document.querySelector("#login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      try {
        await login(emailInput.value.trim(), passwordInput.value);
        const users = await api("/api/demo/users");
        const assemblyId = users?.[0]?.assemblyId || defaultAssemblyId;
        goDashboard(assemblyId);
      } catch (error) {
        showError(error.message || "No se pudo iniciar sesión.");
      }
    });
  </script>
</body>
</html>
