<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Portal del propietario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css?v=own1" />
  <link rel="stylesheet" href="/css/base.css?v=own1" />
  <link rel="stylesheet" href="/css/components.css?v=own1" />
  <link rel="stylesheet" href="/css/ia.css?v=ia2" />
  <link rel="stylesheet" href="/css/ux-remediation.css?v=ux1" />
  <link rel="stylesheet" href="/css/ux-ia-reeng.css?v=ia2" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="app-nav" aria-label="Navegación">
      <div>
        <h1 class="brand">ASAMBLEAS</h1>
        <p class="nav-tenant" id="nav-tenant">Portal propietario</p>
      </div>
      <nav id="ia-nav" aria-label="Navegación contextual"></nav>
    </aside>
    <header class="app-top" role="banner">
      <div class="ia-top-context"><span class="ia-top-context__brand">ASAMBLEAS</span><span class="ia-top-context__path" id="ia-context-label">Portal del propietario</span></div>
      <div class="cluster">
        <span id="user-chip" class="badge badge-live"></span>
        <button type="button" id="btn-logout" class="btn btn-secondary">Salir</button>
      </div>
    </header>
    <main id="main" class="app-workspace page-main">
      <div id="page-alert" class="alert" hidden role="alert"></div>
      <div id="ia-breadcrumbs"></div>
      <section class="page-hero">
        <h1 id="owner-hello">Hola</h1>
        <p class="lede">Consulta tus unidades y entra a las asambleas a las que estás convocado.</p>
      </section>
      <section class="panel" id="next-assembly" aria-labelledby="next-heading">
        <h2 id="next-heading" class="section-title">Próxima asamblea</h2>
        <div id="next-panel" class="empty-state">Cargando…</div>
      </section>
      <section class="panel" id="units" aria-labelledby="units-heading">
        <h2 id="units-heading" class="section-title">Mis unidades</h2>
        <div id="units-panel" class="empty-state">Cargando…</div>
      </section>
      <section class="panel" id="assemblies" aria-labelledby="asm-heading">
        <h2 id="asm-heading" class="section-title">Mis asambleas</h2>
        <div id="assemblies-panel" class="empty-state">Cargando…</div>
      </section>
      <section class="panel" id="account" aria-labelledby="account-heading">
        <h2 id="account-heading" class="section-title">Mi cuenta</h2>
        <div id="account-panel" class="empty-state">Cargando…</div>
      </section>
    </main>
  </div>
  <script type="module" src="/js/modules/owner-portal-app.js?v=ia2"></script>
</body>
</html>
