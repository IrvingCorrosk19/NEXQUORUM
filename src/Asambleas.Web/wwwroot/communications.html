<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Comunicaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css?v=px3" />
  <link rel="stylesheet" href="/css/base.css?v=px3" />
  <link rel="stylesheet" href="/css/components.css?v=px3" />
  <link rel="stylesheet" href="/css/feedback.css?v=fb1" />
  <link rel="stylesheet" href="/css/loading.css?v=px3" />
  <link rel="stylesheet" href="/css/ia.css?v=ia2" />
  <link rel="stylesheet" href="/css/ux-remediation.css?v=ux1" />
  <link rel="stylesheet" href="/css/ux-ia-reeng.css?v=ia2" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="app-nav" aria-label="Navegación">
      <div>
        <h1 class="brand">ASAMBLEAS</h1>
        <p class="nav-tenant" id="nav-tenant">Gobernanza</p>
      </div>
      <nav id="ia-nav" aria-label="Navegación contextual"></nav>
    </aside>

    <header class="app-top" role="banner">
      <div class="ia-top-context"><span class="ia-top-context__brand">ASAMBLEAS</span><span class="ia-top-context__path" id="ia-context-label">Comunicaciones</span></div>
      <div class="cluster">
        <span id="ia-role-chip" class="badge badge-live"></span>
        <span id="user-chip" class="badge badge-live"></span>
        <button type="button" id="btn-logout" class="btn btn-secondary">Salir</button>
      </div>
    </header>

    <main id="main" class="app-workspace page-main">
      <div id="page-alert" class="alert" hidden role="alert"></div>
      <div id="ia-breadcrumbs"></div>
      <section class="page-hero">
        <p class="command-eyebrow">Comunicaciones del PH</p>
        <h1 id="comms-ph-title">Comunicaciones</h1>
        <p class="lede" id="comms-ph-sub">Canales, plantillas y sandbox por propiedad horizontal. Los secretos nunca se muestran.</p>
      </section>

      <div class="stack">
        <section class="panel" aria-labelledby="profile-heading">
          <h2 id="profile-heading" class="section-title">General</h2>
          <form id="profile-form" class="form-grid">
            <label class="field">
              <span>Modo de prueba</span>
              <input type="checkbox" id="profile-sandbox" />
            </label>
            <label class="field">
              <span>Destinatario de prueba</span>
              <input type="email" id="profile-override" placeholder="qa@ejemplo.com" autocomplete="off" />
            </label>
            <label class="field">
              <span>Zona horaria</span>
              <input type="text" id="profile-tz" value="America/Panama" />
            </label>
            <label class="field">
              <span>Nombre remitente</span>
              <input type="text" id="profile-from-name" />
            </label>
            <label class="field">
              <span>Responder a</span>
              <input type="email" id="profile-reply" />
            </label>
            <div class="cta-row">
              <button type="submit" class="btn btn-primary">Guardar perfil</button>
            </div>
          </form>
        </section>

        <section class="panel" aria-labelledby="channels-heading">
          <h2 id="channels-heading" class="section-title">Canales</h2>
          <div id="channels-panel"><div class="skeleton" style="height:8rem"></div></div>
        </section>

        <section class="panel" aria-labelledby="templates-heading">
          <h2 id="templates-heading" class="section-title">Plantillas</h2>
          <form id="template-form" class="form-grid">
            <label class="field"><span>Código</span><input id="tpl-code" required /></label>
            <label class="field"><span>Nombre</span><input id="tpl-name" required /></label>
            <label class="field">
              <span>Canal</span>
              <select id="tpl-scope">
                <option value="Email">Email</option>
                <option value="Portal">Portal</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Sms">SMS</option>
              </select>
            </label>
            <label class="field"><span>Asunto</span><input id="tpl-subject" /></label>
            <label class="field full"><span>HTML</span><textarea id="tpl-html" rows="4"></textarea></label>
            <label class="field full"><span>Texto</span><textarea id="tpl-text" rows="3"></textarea></label>
            <div class="cta-row">
              <button type="submit" class="btn btn-primary">Guardar plantilla</button>
            </div>
          </form>
          <div id="templates-list" class="stack" style="margin-top:1rem"></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/js/modules/communications-app.js?v=px6"></script>
</body>
</html>
