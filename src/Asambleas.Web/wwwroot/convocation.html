<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Convocatoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css?v=px2" />
  <link rel="stylesheet" href="/css/base.css?v=px2" />
  <link rel="stylesheet" href="/css/components.css?v=px2" />
  <link rel="stylesheet" href="/css/feedback.css?v=fb1" />
  <link rel="stylesheet" href="/css/loading.css?v=px2" />
  <link rel="stylesheet" href="/css/ia.css?v=ia2" />
  <link rel="stylesheet" href="/css/ux-remediation.css?v=ux1" />
  <link rel="stylesheet" href="/css/ux-ia-reeng.css?v=ia2" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="app-nav" aria-label="Navegación">
      <div>
        <h1 class="brand">ASAMBLEAS</h1>
        <p class="nav-tenant" id="nav-tenant">Gobernanza</p>
      </div>
      <nav id="ia-nav" aria-label="Navegación contextual"></nav>
    </aside>

    <header class="app-top" role="banner">
      <div class="ia-top-context"><span class="ia-top-context__brand">ASAMBLEAS</span><span class="ia-top-context__path" id="ia-context-label">Convocatoria</span></div>
      <div class="cluster">
        <span id="ia-role-chip" class="badge badge-live"></span>
        <span id="user-chip" class="badge badge-live"></span>
        <button type="button" id="btn-logout" class="btn btn-secondary">Salir</button>
      </div>
    </header>

    <main id="main" class="app-workspace page-main">
      <div id="page-alert" class="alert" hidden role="alert"></div>
      <div id="ia-breadcrumbs"></div>
      <section class="page-hero">
        <p class="command-eyebrow">Convocatoria</p>
        <h1>Convocatoria</h1>
        <p class="lede">Selecciona destinatarios y envía. El correo real usa la configuración SMTP del PH.</p>
      </section>

      <div class="stack">
        <section class="panel">
          <h2 class="section-title">Nueva convocatoria</h2>
          <form id="create-form" class="form-grid">
            <label class="field full"><span>Título</span><input id="c-title" required placeholder="Convocatoria — Asamblea Extraordinaria" /></label>
            <label class="field full"><span>Asunto (opcional)</span><input id="c-subject" placeholder="Se genera automáticamente si lo dejas vacío" /></label>
            <label class="field full"><span>Notas internas (no reemplazan el correo premium)</span><textarea id="c-html" rows="2" placeholder="El correo institucional se genera automáticamente al enviar."></textarea></label>
            <label class="field full" hidden><span>Cuerpo texto</span><textarea id="c-text" rows="2"></textarea></label>
            <fieldset class="field full">
              <legend>Canales</legend>
              <label><input type="checkbox" name="ch" value="Email" checked /> Email</label>
              <label><input type="checkbox" name="ch" value="Portal" checked /> Portal</label>
              <label><input type="checkbox" name="ch" value="WhatsApp" /> WhatsApp</label>
              <label><input type="checkbox" name="ch" value="Sms" /> SMS</label>
            </fieldset>
            <div class="cta-row">
              <button type="submit" class="btn btn-primary">Crear borrador</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <h2 class="section-title">Convocatorias</h2>
          <div id="list-panel"><div class="skeleton" style="height:4rem"></div></div>
        </section>

        <section class="panel" id="detail-panel" hidden>
          <h2 class="section-title">Detalle y envío</h2>
          <div id="detail-body"></div>
          <div class="cta-row" style="margin-top:1rem">
            <button type="button" id="btn-validate" class="btn btn-secondary">Validar</button>
            <button type="button" id="btn-send" class="btn btn-primary">Enviar</button>
          </div>
          <div id="deliveries" style="margin-top:1rem"></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/js/modules/convocation-app.js?v=fb1"></script>
</body>
</html>
