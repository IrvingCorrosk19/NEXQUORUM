<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASAMBLEAS — Convocatoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css?v=px2" />
  <link rel="stylesheet" href="/css/base.css?v=px2" />
  <link rel="stylesheet" href="/css/components.css?v=px2" />
  <link rel="stylesheet" href="/css/loading.css?v=px2" />
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="app-nav" aria-label="Navegación">
      <div>
        <h1 class="brand">ASAMBLEAS</h1>
        <p class="nav-tenant" id="nav-tenant">Gobernanza</p>
      </div>
      <nav>
        <a id="nav-dashboard" href="/dashboard.html">Panel</a>
        <a id="nav-comms" href="/communications.html">Comunicaciones</a>
        <a href="/convocation.html" aria-current="page">Convocatoria</a>
        <a id="nav-assembly" href="#">Sala</a>
      </nav>
    </aside>

    <header class="app-top" role="banner">
      <div class="cluster">
        <span class="command-eyebrow">Convocatoria</span>
        <span id="sandbox-chip" class="badge badge-warn" hidden>MODO PRUEBA</span>
      </div>
      <div class="cluster">
        <span id="user-chip" class="badge badge-live"></span>
        <button type="button" id="btn-logout" class="btn btn-secondary">Salir</button>
      </div>
    </header>

    <main id="main" class="app-workspace page-main">
      <div id="page-alert" class="alert" hidden role="alert"></div>
      <section class="page-hero">
        <p class="command-eyebrow">Envío multicanal</p>
        <h1>Convocatoria</h1>
        <p class="lede">Crear, validar y enviar con confirmación explícita. SENT ≠ DELIVERED.</p>
      </section>

      <div class="stack">
        <section class="panel">
          <h2 class="section-title">Nueva convocatoria</h2>
          <form id="create-form" class="form-grid">
            <label class="field full"><span>Título</span><input id="c-title" required /></label>
            <label class="field full"><span>Asunto</span><input id="c-subject" required /></label>
            <label class="field full"><span>Cuerpo HTML</span><textarea id="c-html" rows="4">Hola {{nombre}}, queda convocado a la asamblea.</textarea></label>
            <label class="field full"><span>Cuerpo texto</span><textarea id="c-text" rows="3">Hola {{nombre}}, queda convocado a la asamblea.</textarea></label>
            <fieldset class="field full">
              <legend>Canales</legend>
              <label><input type="checkbox" name="ch" value="Email" checked /> Email</label>
              <label><input type="checkbox" name="ch" value="Portal" checked /> Portal</label>
              <label><input type="checkbox" name="ch" value="WhatsApp" /> WhatsApp</label>
              <label><input type="checkbox" name="ch" value="Sms" /> SMS</label>
            </fieldset>
            <div class="cta-row">
              <button type="submit" class="btn btn-primary">Crear borrador</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <h2 class="section-title">Convocatorias</h2>
          <div id="list-panel"><div class="skeleton" style="height:4rem"></div></div>
        </section>

        <section class="panel" id="detail-panel" hidden>
          <h2 class="section-title">Detalle y envío</h2>
          <div id="detail-body"></div>
          <div class="cta-row" style="margin-top:1rem">
            <button type="button" id="btn-validate" class="btn btn-secondary">Validar</button>
            <button type="button" id="btn-send" class="btn btn-primary">Enviar</button>
          </div>
          <div id="deliveries" style="margin-top:1rem"></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/js/modules/convocation-app.js?v=px2"></script>
</body>
</html>
